name: Build
on:
  push:
    branches:
      - main
      - "hotfix-**"
      - "release-**"
  pull_request:

jobs:
  build:
    if: ${{ github.event.action != 'labeled' || (github.event.label.name == vars.DEFAULT_LABEL_OK_TO_TEST && vars.DEFAULT_LABEL_OK_TO_TEST != '') }}
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    permissions:
      contents: read
      id-token: write

  component-descriptor:
    if: ${{ github.event.action != 'labeled' || (github.event.label.name == vars.DEFAULT_LABEL_OK_TO_TEST && vars.DEFAULT_LABEL_OK_TO_TEST != '') }}
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@bce63f62928717a11f610ec8022af9feb497d5df # v1
    needs:
      - build
    permissions:
      id-token: write
      contents: write
