                  - instanceType
                  - price
                  - region
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - instanceType
                - region
                - capacityType
                x-kubernetes-list-type: map
              provider:
                description: Provider is the cloud provider for which these prices
                  apply.
                enum:
                - aws
                - gcp
                - azure
                - ali
                - openstack
                type: string
            required:
            - prices
            - provider
            type: object
        required:
